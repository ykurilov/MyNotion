name: MyNotion
options:
  bundleIdPrefix: cloud.kurilov
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  # Приложение русское: системные пункты меню («Файл», «Правка», «Окно») — тоже по-русски.
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  MyNotionKit:
    path: Packages/MyNotionKit
targets:
  MyNotion:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: MyNotionKit
        product: VisualStyle
      - package: MyNotionKit
        product: NotesCore
      - package: MyNotionKit
        product: PageTree
      - package: MyNotionKit
        product: PageEditor
      - package: MyNotionKit
        product: EmojiPicker
      - package: MyNotionKit
        product: PageSearch
      - package: MyNotionKit
        product: MarkdownExport
      - package: MyNotionKit
        product: NotionImport
      - package: MyNotionKit
        product: Sync
      - package: MyNotionKit
        product: UIGallery
      - package: MyNotionKit
        product: ServiceLaunch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.kurilov.mynotion
        PRODUCT_NAME: MyNotion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MyNotion
        INFOPLIST_KEY_CFBundleDevelopmentRegion: ru
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
  UITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
        createIntermediateGroups: true
    dependencies:
      - target: MyNotion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.kurilov.mynotion.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MyNotion
  # Бюджет запуска и памяти: обычные тесты без «песочницы», приложение запускается
  # через систему, как из Dock (исполнитель UI-тестов не может передать ему флаги).
  PerformanceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PerformanceTests
        excludes:
          - UI/**
    dependencies:
      - package: MyNotionKit
        product: NotesCore
      - package: MyNotionKit
        product: NotionImport
      - package: MyNotionKit
        product: PageSearch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.kurilov.mynotion.performancetests
        GENERATE_INFOPLIST_FILE: YES
  # Замеры, которым нужен XCUITest: метрика запуска XCTest, позже — набор текста.
  PerformanceUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: PerformanceTests/UI
      - path: PerformanceTests/Shared
    dependencies:
      - target: MyNotion
      - package: MyNotionKit
        product: NotesCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.kurilov.mynotion.performanceuitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MyNotion
schemes:
  MyNotion:
    build:
      targets:
        MyNotion: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - package: MyNotionKit/VisualStyleTests
        - package: MyNotionKit/NotesCoreTests
        - package: MyNotionKit/PageTreeTests
        - package: MyNotionKit/PageEditorTests
        - package: MyNotionKit/PageSearchTests
        - package: MyNotionKit/MarkdownExportTests
        - package: MyNotionKit/NotionImportTests
        - package: MyNotionKit/SyncTests
        - UITests
    profile:
      config: Release
    archive:
      config: Release
  MyNotionPerformance:
    build:
      targets:
        MyNotion: all
    run:
      config: Release
    test:
      config: Release
      targets:
        - PerformanceTests
        - PerformanceUITests
