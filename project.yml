name: MyNotion
options:
  bundleIdPrefix: cloud.kurilov
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  # Приложение русское: системные пункты меню («Файл», «Правка», «Окно») — тоже по-русски.
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # xcodegen до 2.46 ставил это сам; без него у тестовых целей пустое имя модуля.
    PRODUCT_NAME: $(TARGET_NAME)
packages:
  MyNotionKit:
    path: Packages/MyNotionKit
targets:
  MyNotion:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: MyNotionKit
        product: VisualStyle
      - package: MyNotionKit
        product: NotesCore
      - package: MyNotionKit
        product: PageTree
      - package: MyNotionKit
        product: PageEditor
      - package: MyNotionKit
        product: EmojiPicker
      - package: MyNotionKit
        product: PageSearch
      - package: MyNotionKit
        product: MarkdownExport
      - package: MyNotionKit
        product: NotionImport
      - package: MyNotionKit
        product: Sync
      - package: MyNotionKit
        product: UIGallery
      - package: MyNotionKit
        product: ServiceLaunch
      - package: MyNotionKit
        product: CodeHighlighting
      - package: MyNotionKit
        product: MathRendering
      - package: MyNotionKit
        product: Attachments
      - package: MyNotionKit
        product: LinkPreview
      - package: MyNotionKit
        product: Reminders
      - package: MyNotionKit
        product: EmbeddedMedia
      - package: MyNotionKit
        product: Backlinks
      - package: MyNotionKit
        product: PageVersions
      - package: MyNotionKit
        product: Navigation
      - package: MyNotionKit
        product: PagePicker
      - package: MyNotionKit
        product: PageCover
      # 004: базы данных.
      - package: MyNotionKit
        product: Formulas
      - package: MyNotionKit
        product: Databases
      - package: MyNotionKit
        product: DatabaseGrid
      - package: MyNotionKit
        product: DatabaseViewBar
      - package: MyNotionKit
        product: DatabaseRowPage
      - package: MyNotionKit
        product: NotionSchemaFetch
      # 005: управление из командной строки. Сама команда `mynotion` лежит внутри пакета: обновляется вместе с приложением.
      - package: MyNotionKit
        product: ControlProtocol
      - package: MyNotionKit
        product: ControlServer
      - package: MyNotionKit
        product: ControlCommands
      - package: MyNotionKit
        product: Proofreading
      - package: MyNotionKit
        product: PageMarkdown
      - target: mynotion-cli
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.kurilov.mynotion
        PRODUCT_NAME: MyNotion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MyNotion
        INFOPLIST_KEY_CFBundleDevelopmentRegion: ru
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
      # Постоянная подпись: у каждой сборки одно и то же требование подписи, и Связка ключей и разрешения macOS
      # не спрашивают заново после обновления. Сертификат — на основном Mac; на iMac — ad-hoc (scripts/imac/lib.sh).
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: DC5QSJ54MB
  # 005: команда `mynotion` для агентов (research R14). Цель не «mynotion»: на диске без учёта регистра её служебная папка совпала бы с папкой MyNotion.
  mynotion-cli:
    type: tool
    platform: macOS
    sources:
      - Tools/mynotion
    dependencies:
      - package: MyNotionKit
        product: ControlProtocol
      - package: MyNotionKit
        product: ControlClient
    settings:
      base:
        PRODUCT_NAME: mynotion
        PRODUCT_BUNDLE_IDENTIFIER: cloud.kurilov.mynotion.cli
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: DC5QSJ54MB
  UITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
        createIntermediateGroups: true
      # Образец выгрузки Notion для «Файл → Импорт из Notion…»: UI-тесты идут в виртуальном Mac, где исходников нет.
      - path: Packages/MyNotionKit/Tests/NotionImportTests/Fixtures/notion-export/synthetic-nested.zip
        buildPhase: resources
    dependencies:
      - target: MyNotion
      - package: MyNotionKit
        product: NotesCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.kurilov.mynotion.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MyNotion
  # Бюджет запуска и памяти: обычные тесты без «песочницы», приложение запускается
  # через систему, как из Dock (исполнитель UI-тестов не может передать ему флаги).
  PerformanceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PerformanceTests
        excludes:
          - UI/**
    dependencies:
      - package: MyNotionKit
        product: NotesCore
      - package: MyNotionKit
        product: NotionImport
      - package: MyNotionKit
        product: PageSearch
      # Пробы TextKit 2 этапа 0 (research R16) открывают настоящий редактор страницы.
      - package: MyNotionKit
        product: PageEditor
      # US1: настоящая обложка в пробе вида страницы.
      - package: MyNotionKit
        product: PageCover
      # US6: замер истории версий и набора во время записи версий.
      - package: MyNotionKit
        product: PageVersions
      # 004, этап 0: пробы сетки, запроса вида, формул, связей и встроенной базы (research R20).
      - package: MyNotionKit
        product: Databases
      - package: MyNotionKit
        product: DatabaseGrid
      - package: MyNotionKit
        product: DatabaseViewBar
      - package: MyNotionKit
        product: Formulas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.kurilov.mynotion.performancetests
        GENERATE_INFOPLIST_FILE: YES
  # Замеры, которым нужен XCUITest: метрика запуска XCTest, позже — набор текста.
  PerformanceUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: PerformanceTests/UI
      - path: PerformanceTests/Shared
    dependencies:
      - target: MyNotion
      - package: MyNotionKit
        product: NotesCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.kurilov.mynotion.performanceuitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MyNotion
schemes:
  MyNotion:
    build:
      targets:
        MyNotion: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - package: MyNotionKit/VisualStyleTests
        - package: MyNotionKit/NotesCoreTests
        - package: MyNotionKit/PageTreeTests
        - package: MyNotionKit/PageEditorTests
        - package: MyNotionKit/PageSearchTests
        - package: MyNotionKit/MarkdownExportTests
        - package: MyNotionKit/NotionImportTests
        - package: MyNotionKit/SyncTests
        - package: MyNotionKit/CodeHighlightingTests
        - package: MyNotionKit/MathRenderingTests
        - package: MyNotionKit/AttachmentsTests
        - package: MyNotionKit/LinkPreviewTests
        - package: MyNotionKit/RemindersTests
        - package: MyNotionKit/EmbeddedMediaTests
        - package: MyNotionKit/BacklinksTests
        - package: MyNotionKit/PageVersionsTests
        - package: MyNotionKit/NavigationTests
        - package: MyNotionKit/PagePickerTests
        - package: MyNotionKit/PageCoverTests
        - package: MyNotionKit/ControlProtocolTests
        - package: MyNotionKit/ControlServerTests
        - package: MyNotionKit/ControlClientTests
        - package: MyNotionKit/ControlCommandsTests
        - package: MyNotionKit/PageMarkdownTests
        - package: MyNotionKit/ProofreadingTests
        - UITests
    profile:
      config: Release
    archive:
      config: Release
  MyNotionPerformance:
    build:
      targets:
        MyNotion: all
    run:
      config: Release
    test:
      config: Release
      targets:
        - PerformanceTests
        - PerformanceUITests
