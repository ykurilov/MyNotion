services:
  mynotion-sync:
    build: .
    image: mynotion-sync:latest
    container_name: mynotion-sync
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_DIR: /data
      BACKUP_KEEP: "14"
      # квота зашифрованных файлов, ГБ (считается по всем файлам, включая корзину)
      FILES_LIMIT_GB: "50"
      # место под открытые копии страниц по ссылке (/data/shares), ГБ: их всегда можно опубликовать заново, в копии не входят
      SHARES_LIMIT_GB: "10"
      # тихие пуши iPhone (Apple Push Notification service): ключ .p8 команды Apple — файлом на томе ./data/apns,
      # без ключа сервер работает как прежде, только не будит iPhone. Секрет в образ и в git не кладётся.
      APNS_KEY_FILE: ${APNS_KEY_FILE:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      # необязательные: пусто — команда DC5QSJ54MB, приложение cloud.kurilov.mynotion.ios, не чаще пуша в 300 с
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      PUSH_MIN_INTERVAL_SECONDS: ${PUSH_MIN_INTERVAL_SECONDS:-}
    volumes:
      # база, файлы (/data/files) и ежедневные копии (/data/backups) лежат на хосте: видны и копируются без входа в контейнер.
      # Копия файлов — жёсткие ссылки, поэтому files и backups должны быть на одной файловой системе (один том ./data)
      - ./data:/data
    ports:
      - "127.0.0.1:3320:3000"
    # снимок до 200 МБ разбирается целиком в памяти
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
